{% extends "base.html" %}
{% from "_macros.html" import upcoming_sections %}
{% block title %}Upcoming{% endblock %}
{% block eyebrow %}{{ plan.today | day }}{% endblock %}
{% block content %}
<div class="toolbar">
  <h1>Upcoming</h1>
  <a class="btn" href="{{ url_for('views.new_task', next=request.full_path.rstrip('?')) }}">+ Task</a>
</div>
<div class="upcoming">
  {{ upcoming_sections(plan, upcoming, statuses) }}
</div>
{% endblock %}
