{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="login card">
  <p class="eyebrow"><span class="dot"></span>Household finance</p>
  <h1>Log in</h1>
  <form method="post" action="{{ url_for('auth.link_confirm') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="token" value="{{ token }}">
    <button type="submit" class="primary">Log in as {{ name }}</button>
  </form>
</section>
{% endblock %}
